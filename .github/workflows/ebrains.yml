name: Mirror to Ebrains

on:
  push:

jobs:
  to_ebrains:
    runs-on: ubuntu-latest
    steps:
      - name: syncmaster
        uses: wei/git-sync@v3
        with:
          source_repo: "madgik/datacatalog"
          source_branch: "master"
          destination_repo: "https://ghpusher:${{ secrets.EBRAINS_GITLAB_ACCESS_TOKEN }}@gitlab.ebrains.eu/hbp-mip/datacatalog.git"
          destination_branch: "master"

      - name: synctags
        uses: wei/git-sync@v3
        with:
          source_repo: "madgik/datacatalog"
          source_branch: "refs/tags/*"
          destination_repo: "https://ghpusher:${{ secrets.EBRAINS_GITLAB_ACCESS_TOKEN }}@gitlab.ebrains.eu/hbp-mip/datacatalog.git"
          destination_branch: "refs/tags/*"
