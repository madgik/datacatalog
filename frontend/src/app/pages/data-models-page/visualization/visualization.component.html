<div id="chart-container">

  <!-- Canvas Layer -->
  <ng-container *ngIf="!error; else errorTemplate">
    <div id="chart"></div>
  </ng-container>

  <!-- Floating Overlays -->

  <!-- Top Left: Breadcrumbs -->
  <div class="overlay-top-left">
    <app-breadcrumb [breadcrumbs]="breadcrumbPath" (breadcrumbClick)="handleBreadcrumbClick($event)">
    </app-breadcrumb>
  </div>

  <!-- Top Right: Search -->
  <div class="overlay-top-right">
    <app-search-bar *ngIf="dataModelHierarchy" [dataModelHierarchy]="dataModelHierarchy"
      (searchResultSelected)="onSearchResult($event)">
    </app-search-bar>
  </div>

  <!-- Bottom Center: Floating Toolbar -->
  <div class="floating-toolbar control-glass">

    <!-- Zoom Controls -->
    <div class="control-group">
      <button class="icon-btn" (click)="zoomOut()" title="Zoom Out">
        <i class="fas fa-minus"></i>
      </button>
      <span class="zoom-level">{{ currentZoomLevel | percent:'1.0-0' }}</span>
      <button class="icon-btn" (click)="zoomIn()" title="Zoom In">
        <i class="fas fa-plus"></i>
      </button>
    </div>

    <div class="divider"></div>

    <!-- Reset View -->
    <button class="text-btn" (click)="resetView()">
      <i class="fas fa-compress-arrows-alt"></i> Reset View
    </button>

    <div class="divider"></div>

    <!-- Max Depth Stepper -->
    <div class="control-group">
      <span class="label-small">DEPTH</span>
      <div class="depth-pills">
        <button *ngFor="let depth of createArray(newAvailableDepths)" [class.active]="maxDepth === depth"
          (click)="maxDepth = depth; onMaxDepthChange()">
          {{ depth }}
        </button>
      </div>
    </div>

    <div class="divider"></div>

    <!-- Fullscreen -->
    <button class="icon-btn" (click)="toggleFullscreen()" title="Fullscreen">
      <i class="fas" [ngClass]="isFullscreen ? 'fa-compress' : 'fa-expand'"></i>
    </button>
  </div>

  <!-- Error Template -->
  <ng-template #errorTemplate>
    <div class="error-message">
      {{ error }}
    </div>
  </ng-template>

</div>
